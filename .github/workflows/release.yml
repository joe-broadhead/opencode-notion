name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build the release files
        run: |
          set -euo pipefail
          npx plugin-kit conformance --json > conformance-report.json
          (cd dist && sha256sum index.js) > SHA256SUMS
          sha256sum conformance-report.json >> SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/index.js conformance-report.json SHA256SUMS --generate-notes
